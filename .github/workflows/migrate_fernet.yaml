name: Rotate Fernet key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install migration dependencies
        run: python -m pip install --disable-pip-version-check cryptography requests

      - name: Rotate and verify encrypted Firebase records
        env:
          OLD_SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
          NEW_FERNET_KEY: ${{ secrets.FERNET_MIGRATION_KEY }}
        run: python .github/workflows/migrate_fernet.py
